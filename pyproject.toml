[tool.poetry]
name = "python-zte-mc801a"
version = "0.1.0"
description = ""
authors = ["Nicolas Jaccard <nicolas.jaccard@gmail.com>"]
readme = "README.md"
packages = [{include = "python_zte_mc801a"}]
homepage = "https://github.com/nicjac/python-zte-mc801a"
repository = "https://github.com/nicjac/python-zte-mc801a"

[tool.poetry.scripts]
python-zte-mc801a = "python_zte_mc801a.main:app"

[tool.poetry.dependencies]
python = "^3.9"
typer = {extras = ["all"], version = "^0.7.0"}
requests = "^2.28.2"
pyyaml = "^6.0"
retry = "^0.9.2"
termplotlib = "^0.3.9"


[tool.poetry.group.dev.dependencies]
black = {version = "^23.1a1", allow-prereleases = true}
flake8 = "^7.0"
pylint = "^3.0"
pytest = "^8.0"

[tool.pylint.main]
load-plugins = []

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "R0917",  # too-many-positional-arguments (library API)
    "W0511",  # fixme
    "W1203",  # logging-fstring-interpolation (f-strings are fine)
]

[tool.pylint.format]
max-line-length = 140

[tool.pylint.design]
max-args = 8

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
